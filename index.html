<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Play Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock, Paper, Scissors</h1>
    <div class="input">
        <label for="humanInput">You: </label>
        <input type="text" id="humanInput" class="humanInput" />
        <input type="submit" value="Ready!" class="humanInputSubmit" />
    </div>
    
    <div class="results">
    <p class="computerDisplay"></p>
    <p class="resultsExplanation"></p>
    <p class="roundsPlayedDisplay"></p>
    <p class="humanWins"></p>
    <p class="computerWins"></p>
    <p class="tiedGames"></p>
    </div>
    
    
    
<script>
    /* set HTML constants */
    const computerDisplay = document.querySelector(".computerDisplay")
    const humanInput = document.querySelector(".humanInput")
    const humanInputSubmit = document.querySelector(".humanInputSubmit")
    const resultsExplanation = document.querySelector(".resultsExplanation")
    const roundsPlayedDisplay = document.querySelector(".roundsPlayedDisplay")
    const humanWins = document.querySelector(".humanWins")
    const computerWins = document.querySelector(".computerWins")
    const tiedGames = document.querySelector(".tiedGames")


    /* set initial scores */
    var humanScore = 0;
    var computerScore = 0;
    var drawScore = 0;
    var roundsPlayed = 0;

    computerDisplay.textContent = "Computer: ???????"; //don't show answer too early

    function playRound() {
    /* getComputerChoice will randomly return rock, paper or scissors */
        function getComputerChoice() {
            return Math.floor(Math.random() * 3);
        }

    var computerChoiceOutput = getComputerChoice();

    if (computerChoiceOutput === 0) {
        var computerChoice = "Rock";
    } else if (computerChoiceOutput === 1) {
        var computerChoice = "Paper";
    } else if (computerChoiceOutput === 2) {
        var computerChoice = "Scissors";
    }
    /* show user what the computer chose */
    computerDisplay.textContent = "Computer: " + computerChoice
    console.log(computerChoice)

    /* getHumanChoice will take human choice and return it */
    var humanChoice;
    const getHumanChoice = humanInput.value;

    if (getHumanChoice != "" && getHumanChoice != null) {
        let getHumanChoicefilter = getHumanChoice.toLowerCase().replaceAll(" ","");
        if (getHumanChoicefilter === "rock") {
            var humanChoice = "Rock";
        } else if (getHumanChoicefilter === "paper") {
            var humanChoice = "Paper";
        } else if (getHumanChoicefilter === "scissors") {
            var humanChoice = "Scissors";
        } else {
            alert("Sorry, I didn't understand that!");
        }    
    } else {
        //reedit for function
    }

    console.log(humanChoice)

    /* drawing */
    if (computerChoice === humanChoice) {
        resultsExplanation.textContent = "It's a draw!";
        var drawScore = (+drawScore + 1);
    }
    /* ways of losing */    
    if ((computerChoice === "Rock" && humanChoice === "Scissors") || (
        computerChoice === "Paper" && humanChoice === "Rock") || (
        computerChoice === "Scissors" && humanChoice === "Paper")) {
            resultsExplanation.textContent = computerChoice + " beats " + humanChoice.toLowerCase() + ", you lose!";
            var computerScore = (+computerScore + 1);
    /* ways of winning */
    } else if ((humanChoice === "Rock" && computerChoice === "Scissors") || (
        humanChoice === "Paper" && computerChoice === "Rock") || (
        humanChoice === "Scissors" && computerChoice === "Paper")) {
            resultsExplanation.textContent = humanChoice + " beats " + computerChoice.toLowerCase() + ", you win!";
            var humanScore = (+humanScore + 1);
    }

    roundsPlayed++;

    /* update HTML display */
    roundsPlayedDisplay.textContent = "You have played " + roundsPlayed + " rounds."
    humanWins.textContent = "You have " + humanScore + " point(s).";
    computerWins.textContent = "The computer has " + computerScore + " point(s).";
    tiedGames.textContent = "You have drawn a total of " + drawScore + " times.";
    }

    /*start game */
    humanInputSubmit.addEventListener("click", playRound)
    
</script>

</body>
</html>
